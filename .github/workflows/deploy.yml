name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Build Main Frontend
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: rm -rf package-lock.json node_modules && npm install

      - name: Build (Frontend)
        working-directory: ./frontend
        run: npm run build
        # Note: You may need to set the base path in vite.config.ts:
        # base: '/demo-choxedap/'

      # Build Admin Frontend
      - name: Install dependencies (Admin)
        working-directory: ./frontend_admin
        run: rm -rf package-lock.json node_modules && npm install

      - name: Build (Admin)
        working-directory: ./frontend_admin
        run: npm run build
        # Note: You may need to set the base path in vite.config.ts:
        # base: '/demo-choxedap/admin/'

      # Prepare combined output
      - name: Merge build outputs
        run: |
          mkdir -p final-dist
          cp -r frontend/dist/* final-dist/
          mkdir -p final-dist/admin
          cp -r frontend_admin/dist/* final-dist/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
